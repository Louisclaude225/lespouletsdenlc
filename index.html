<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Poulets de NLC - Admin Dashboard</title>
    <!-- Google Fonts : Typographie moderne -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Variables de couleur basées sur votre app.json */
        :root {
            --bg-dark: #110800;       /* Fond principal identique à l'app */
            --bg-card: #1c1107;       /* Fond des cartes légèrement plus clair */
            --primary-gold: #c8a84b;  /* Votre doré officiel (notifications/boutons) */
            --text-main: #f5f0eb;     /* Texte principal */
            --text-muted: #a69a8f;    /* Texte secondaire */
            --border-color: #2c1f14;  /* Bordures subtiles */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Barre de navigation supérieure */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge-admin {
            background-color: rgba(200, 168, 75, 0.15);
            color: var(--primary-gold);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(200, 168, 75, 0.3);
        }

        /* Conteneur principal */
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        /* Grille de statistiques rapides */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s, border-color 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-gold);
        }

        .stat-card h3 {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Section principale : Gestion des commandes */
        .content-section {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Bouton doré style application mobile */
        .btn-primary {
            background-color: var(--primary-gold);
            color: #000000;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* Tableau des commandes fluide */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Statuts colorés */
        .status {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .status.completed { background-color: rgba(46, 213, 115, 0.15); color: #2ed573; }
        .status.pending { background-color: rgba(255, 165, 2, 0.15); color: #ffa502; }

        /* Actions du tableau */
        .btn-action {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-right: 5px;
        }
        .btn-action:hover {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>🍗 Les Poulets de NLC</h1>
        <div class="user-profile">
            <span class="badge-admin">Administrateur</span>
            <span id="user-email" style="font-size: 0.9rem; color: var(--text-muted);">Connexion...</span>
        </div>
    </header>

    <!-- Corps principal -->
    <main>
        <!-- Grille de KPIs rapides -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Commandes en attente</h3>
                <div class="value" id="count-pending">-</div>
            </div>
            <div class="stat-card">
                <h3>Volailles réservées</h3>
                <div class="value" id="count-chickens">-</div>
            </div>
            <div class="stat-card">
                <h3>Chiffre d'affaires (Jour)</h3>
                <div class="value" id="revenue-today">-</div>
            </div>
        </div>

        <!-- Section de gestion -->
        <div class="content-section">
            <div class="section-header">
                <h2>Gestion des Commandes de l'Élevage</h2>
                <button class="btn-primary" onclick="alert('Fonctionnalité de création manuelle')">+ Nouvelle Commande</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID Commande</th>
                            <th>Client</th>
                            <th>Quantité (Poulets)</th>
                            <th>Statut</th>
                            <th>Actions (Admin)</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body">
                        <!-- Exemple de ligne visuelle en attendant la connexion Firebase -->
                        <tr>
                            <td>#NLC-1024</td>
                            <td>Client Élevage Privé</td>
                            <td>150 pcs</td>
                            <td><span class="status pending">En attente</span></td>
                            <td>
                                <button class="btn-action">Modifier</button>
                                <button class="btn-action" style="color: #ff4757;">Annuler</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
